<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo das Comunidades Quilombolas - MG e RJ</title>
    
    <!-- CSS do Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Arquivo CSS Local -->
    <link rel="stylesheet" href="estilo.css" />
</head>
<body>

    <!-- Container onde o mapa é renderizado -->
    <div id="map"></div>

    <!-- Modal/Janela para ampliar as imagens ao clicar -->
    <div id="imagemModal" class="modal-imagem" onclick="fecharModal()">
        <span class="fechar-modal">&times;</span>
        <img id="imagemExpandida" class="conteudo-modal" alt="Imagem ampliada">
    </div>

    <!-- JS do Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Arquivo JS Local (com todo o conteúdo dos marcadores) -->
    <script src="mapa.js"></script>

</body>
</html>
