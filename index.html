<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa Interativo de Quilombos - MG e RJ</title>
    
    <!-- CSS do Leaflet via JSDelivr (Servidor Desbloqueado) -->
    <link rel="stylesheet" href="https://jsdelivr.net" />
    
    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #f8f9fa; /* Fundo cinza claro caso o mapa demore a carregar */
        }

        .leaflet-popup-content-wrapper {
            font-family: Arial, sans-serif;
            font-size: 14.5px;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        details {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 6px;
            margin-top: 12px;
            cursor: pointer;
            border: 1px solid #e9ecef;
        }

        details[open] summary {
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 6px;
            margin-bottom: 6px;
            color: #d946ef;
        }

        summary {
            font-weight: bold;
            outline: none;
            color: #2563eb;
        }

        .popup-titulo {
            margin: 0 0 8px 0;
            color: #1e293b;
            font-size: 16px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- JavaScript do Leaflet via JSDelivr (Servidor Desbloqueado) -->
    <script src="https://jsdelivr.net"></script>

    <script>
        // Inicializa o mapa
        const map = L.map('map', {
            center: [-14.2350, -51.9253],
            zoom: 4
        });

        // Camadas de mapas de servidores diferentes para evitar bloqueios
        const mapaPadrao = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        const mapaEscuro = L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 20
        });

        mapaPadrao.addTo(map);

        const mapasBase = {
            "Mapa Padrão": mapaPadrao,
            "Visual Escuro (Dark)": mapaEscuro
        };
        L.control.layers(mapasBase).addTo(map);

        // Animação de aproximação
        setTimeout(() => {
            map.flyTo([-19.5000, -42.8000], 6, {
                animate: true,
                duration: 3.0
            });
        }, 2000);

        // Marcador: Comunidade de Mumbuca (MG)
        const marcadorMG = L.marker([-16.4355, -41.0033]).addTo(map);
        const conteudoMG = `
            <h3 class="popup-titulo">📍 Comunidade de Mumbuca</h3>
            <p><b>Município:</b> Jequitinhonha (MG)</p>
            <p>Aqui você pode usar <b>Negrito</b>, <i>Itálico</i> e <u>Sublinhado</u>.</p>
            <details>
                <summary>👉 Clique para expandir (Toggle)</summary>
                <p style="margin-top: 5px; color: #475569;">Este é o texto oculto que funciona perfeitamente!</p>
            </details>
        `;
        marcadorMG.bindPopup(conteudoMG);

        // Marcador: Quilombo do Campinho da Independência (RJ)
        const marcadorRJ = L.marker([-23.2961, -44.7008]).addTo(map);
        const conteudoRJ = `
            <h3 class="popup-titulo">📍 Campinho da Independência</h3>
            <p><b>Município:</b> Paraty (RJ)</p>
            <details>
                <summary>📋 Ver Atrativos Culturais</summary>
                <p style="margin-top: 5px; color: #475569;">• Restaurante Quilombola<br>• Artesanato tradicional</p>
            </details>
        `;
        marcadorRJ.bindPopup(conteudoRJ);
    </script>
</body>
</html>
